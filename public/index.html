<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Checkout demo</title>
<style>body{font:18px system-ui;max-width:680px;margin:5rem auto;padding:0 1rem}input{font:inherit;width:7rem}button{font:inherit;padding:.4rem 1rem}pre{background:#f2f4f8;padding:1rem}</style>
<h1>Checkout demo</h1>
<p>Change a checkout rule, run the tests, and watch Jenkins decide whether to deploy.</p>
<form id="checkout">
  <label>Quantity <input name="quantity" type="number" value="2" min="1"></label>
  <label>Unit price (cents) <input name="unitPrice" type="number" value="500" min="0"></label>
  <label>Stock <input name="stock" type="number" value="5" min="0"></label>
  <button>Place demo order</button>
</form>
<pre id="result">Ready</pre>
<script>
document.querySelector('#checkout').addEventListener('submit', async event => {
  event.preventDefault();
  const values = Object.fromEntries(new FormData(event.target));
  const response = await fetch('/api/checkout', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(Object.fromEntries(Object.entries(values).map(([k,v])=>[k,Number(v)])))});
  document.querySelector('#result').textContent = JSON.stringify(await response.json(), null, 2);
});
</script>
</html>
