<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout demo</title>
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; color: #183153; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 18px; }
    main { max-width: 760px; margin: 0 auto; }
    .eyebrow { color: #2267c9; font-size: 13px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.1; margin: 12px 0; }
    .intro { color: #51657c; line-height: 1.6; margin: 0 0 28px; }
    .card { background: white; border: 1px solid #dce5f0; border-radius: 18px; box-shadow: 0 16px 38px #17345a12; padding: 28px; }
    h2 { font-size: 20px; margin: 0 0 20px; }
    .fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    label { display: block; color: #43576e; font-size: 14px; font-weight: 650; }
    input { display: block; width: 100%; margin-top: 8px; border: 1px solid #b9c9db; border-radius: 10px; padding: 12px; color: #183153; font: inherit; }
    input:focus { outline: 3px solid #c6dcff; border-color: #2267c9; }
    button { border: 0; border-radius: 10px; background: #2267c9; color: white; cursor: pointer; font: inherit; font-weight: 700; margin-top: 22px; padding: 13px 22px; }
    button:hover { background: #1855aa; }
    button:disabled { opacity: .65; cursor: wait; }
    .result { margin-top: 22px; border-radius: 12px; background: #edf6f0; border: 1px solid #cde7d3; padding: 18px; }
    .result.error { background: #fff2f2; border-color: #f3cece; }
    .result p { margin: 0; color: #42604a; }
    .result.error p { color: #a12c2c; }
    .total { font-size: 32px; font-weight: 800; margin: 5px 0; }
    .detail { color: #51657c; font-size: 14px; }
    @media (max-width: 600px) { body { padding-top: 30px; } .card { padding: 20px; } .fields { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Jenkins CI/CD demo</div>
    <h1>Checkout demo — updated version</h1>
    <p class="intro">A release reaches this page only after Jenkins passes the checkout tests, builds the image, and deploys it.</p>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Try a checkout</h2>
      <form id="checkout">
        <div class="fields">
          <label>Quantity <input name="quantity" type="number" value="2" min="1" step="1" required></label>
          <label>Unit price (cents) <input name="unitPrice" type="number" value="500" min="0" step="1" required></label>
          <label>Available stock <input name="stock" type="number" value="5" min="0" step="1" required></label>
        </div>
        <button type="submit">Place demo order</button>
      </form>
      <div id="result" class="result" role="status" aria-live="polite">
        <p>Enter an order and place it to see the result.</p>
      </div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#checkout');
    const result = document.querySelector('#result');
    const button = form.querySelector('button');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const order = Object.fromEntries(
        [...new FormData(form)].map(([key, value]) => [key, Number(value)])
      );
      button.disabled = true;
      result.classList.remove('error');
      const pending = document.createElement('p');
      pending.textContent = 'Checking out…';
      result.replaceChildren(pending);

      try {
        const response = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(order)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Checkout failed');

        const heading = document.createElement('p');
        heading.textContent = 'Order accepted';
        const total = document.createElement('div');
        total.className = 'total';
        total.textContent = data.total + ' cents';
        const detail = document.createElement('div');
        detail.className = 'detail';
        detail.textContent = data.quantity + ' item(s) · ' + data.remainingStock + ' left in stock · $' + (data.total / 100).toFixed(2);
        result.replaceChildren(heading, total, detail);
      } catch (error) {
        result.classList.add('error');
        const message = document.createElement('p');
        message.textContent = error.message;
        result.replaceChildren(message);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
