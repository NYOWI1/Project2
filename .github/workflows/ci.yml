name: Checkout demo CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test checkout rules and API
        run: npm test
      - name: Build demo assets
        run: npm run build
      - name: Build Docker image
        run: docker build -t checkout-demo:ci .
      - name: Start demo container
        run: docker run -d --name checkout-demo-ci -p 127.0.0.1:3005:3000 checkout-demo:ci
      - name: Check running container
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:3005/health
      - name: Remove demo container
        if: always()
        run: docker rm -f checkout-demo-ci || true
